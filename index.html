<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jujutsu Kaisen Characters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jjk: {
              dark: '#0a0a0f',
              card: '#14141f',
              accent: '#6d28d9',
              light: '#a78bfa',
              alive: '#22c55e',
              dead: '#ef4444',
              unknown: '#eab308',
            },
          },
        },
      },
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(109, 40, 217, 0.25);
    }

    .fade-in {
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .modal-backdrop {
      animation: backdropIn 0.2s ease forwards;
    }
    @keyframes backdropIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #6d28d9; border-radius: 4px; }
  </style>
</head>
<body class="bg-jjk-dark text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-jjk-dark/80 backdrop-blur-md border-b border-white/5">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center gap-4">
      <h1 class="text-2xl sm:text-3xl font-black tracking-tight">
        <span class="text-jjk-light">呪術</span> Jujutsu Kaisen
      </h1>
      <div class="flex-1 w-full sm:w-auto">
        <input
          id="search"
          type="text"
          placeholder="Search characters..."
          class="w-full sm:max-w-xs bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-jjk-accent transition"
        />
      </div>
      <div class="flex gap-2 flex-wrap justify-center">
        <button data-filter="all" class="filter-btn active px-3 py-1.5 text-xs font-semibold rounded-full bg-jjk-accent text-white transition">All</button>
        <button data-filter="Alive" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-full bg-white/5 text-gray-400 hover:bg-white/10 transition">Alive</button>
        <button data-filter="Dead" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-full bg-white/5 text-gray-400 hover:bg-white/10 transition">Dead</button>
        <button data-filter="Unknown" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-full bg-white/5 text-gray-400 hover:bg-white/10 transition">Unknown</button>
      </div>
    </div>
  </header>

  <!-- Loading -->
  <div id="loading" class="flex flex-col items-center justify-center py-32 gap-4">
    <div class="w-12 h-12 border-4 border-jjk-accent border-t-transparent rounded-full animate-spin"></div>
    <p class="text-gray-500 text-sm">Loading characters...</p>
  </div>

  <!-- Error -->
  <div id="error" class="hidden flex-col items-center justify-center py-32 gap-4 text-center px-4">
    <p class="text-red-400 text-lg font-semibold">Failed to load characters</p>
    <p id="error-msg" class="text-gray-500 text-sm"></p>
    <button onclick="fetchCharacters()" class="mt-2 px-4 py-2 bg-jjk-accent rounded-lg text-sm font-medium hover:bg-jjk-accent/80 transition">Retry</button>
  </div>

  <!-- Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <p id="results-count" class="text-gray-500 text-sm mb-6 hidden"></p>
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    <p id="no-results" class="hidden text-center text-gray-500 py-20">No characters found.</p>
  </main>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-black/70 backdrop-blur-sm" id="modal-backdrop"></div>
    <div class="relative bg-jjk-card border border-white/10 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl z-10">
      <button id="modal-close" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition text-gray-300">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
